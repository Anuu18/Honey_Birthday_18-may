<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAPPY BIRTHDAY MY LOVE ❤️</title>
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.33/dist/lenis.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&family=Syncopate:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- OVERLAYS -->
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="noise"></div>

    <!-- HUD -->
    <div class="hud">
        <div class="hud-top">
            <span>HAPPY BIRTHDAY HONEY ❤️</span>
            <div class="hud-line"></div>
            <span>LOVE YOU ALWAYS 💕</span>
        </div>

        <div class="center-nav"
            style="align-self: flex-start; margin-top: auto; margin-bottom: auto; writing-mode: vertical-rl; transform: rotate(180deg);">
            YOU ARE MY EVERYTHING 💖 // <strong id="vel-readout">FOREVER</strong>
        </div>

        <div class="hud-bottom">
            <span>DATE: <strong>18 MAY 🎂</strong></span>
            <div class="hud-line"></div>
            <span>FROM YOUR LOVE ❤️</span>
        </div>
    </div>

    <!-- 3D WORLD -->
    <div class="viewport" id="viewport">
        <div class="world" id="world"></div>
    </div>

    <div class="scroll-proxy"></div>

    <!-- link -->
    <script src="./script.js"></script>

</body>
</html>
